name: Coinbase research

on:
  workflow_dispatch: {}
  schedule:
    - cron: "41 1 * * 0"       # weekly, Sunday

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install research libraries
        run: |
          pip install -r cex/requirements-research.txt || pip install pandas vectorbt quantstats
      - name: Backtest and independent check
        run: |
          python cex/backtest.py
          python cex/deep_check.py
      - name: Save results
        if: always()
        run: |
          git config user.name "cex-research"
          git config user.email "paper-desk@users.noreply.github.com"
          git add BACKTEST.md DEEPCHECK.md reports data-cex/backtest-results.csv || true
          git commit -m "Coinbase research $(date -u +'%Y-%m-%d')" || exit 0
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 5
          done
          exit 1
