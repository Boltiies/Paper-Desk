name: Paper desk

on:
  schedule:
    - cron: "7 */6 * * *"     # every 6 hours; each run trades for about 5h40m
  workflow_dispatch: {}        # lets you start a run from the Actions tab

concurrency:
  group: paper-desk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Paper trade
        timeout-minutes: 345
        run: python paper_trader.py --minutes 340
      - name: Save results
        if: always()
        run: |
          git config user.name "paper-desk"
          git config user.email "paper-desk@users.noreply.github.com"
          git add data REPORT.md || true
          git commit -m "Paper desk results $(date -u +'%Y-%m-%d %H:%M')" || exit 0
          git pull --rebase || true
          git push
